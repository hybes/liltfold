[package]
name = "liltfold"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A local, native macOS media browser"
license = "MIT"
repository = "https://github.com/hybes/liltfold"
readme = "README.md"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
